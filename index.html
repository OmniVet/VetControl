<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VetControl</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="logo-icone.png">
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <img src="logo.jpg" alt="VetControl" class="logo-login">
      <p class="muted">Entre com seu usuário</p>
      <label>E-mail<input type="email" name="email" required /></label>
      <label>Senha<input type="password" name="senha" required /></label>
      <button class="btn primary" type="submit">Entrar</button>
      <a href="#" id="esqueci" class="muted small">Esqueci minha senha</a>
      <p id="loginErro" class="erro"></p>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="logo"><img src="logo-icone.png" alt="" class="logo-ico">Vet<span>Control</span></div>
      <nav id="menu"><a href="#painel" class="btn-inicio">🏠 Início</a>
        <span class="hidden"><span id="badgeAlerta"></span><span id="badgeSol"></span></span></nav>
      <div class="user"><span id="userNome"></span> <button id="sair" class="btn small">Sair</button></div>
    </header>
    <div id="subnav" class="subnav"></div>
    <main id="view"></main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <form id="modalForm" class="card modal-card">
      <h2 id="modalTitulo"></h2>
      <div id="modalCorpo"></div>
      <p id="modalErro" class="erro"></p>
      <div class="acoes">
        <button type="button" class="btn" id="modalCancelar">Cancelar</button>
        <button type="submit" class="btn primary" id="modalOk">Salvar</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="semConexao" class="login hidden"><div class="card login-card"><h1>Vet<span>Control</span></h1>
    <p><b>Não foi possível abrir o sistema.</b></p><p class="muted small" id="semConexaoMsg">A conexão com o Firebase não respondeu. Verifique a internet e atualize a página (Ctrl + Shift + R). Se continuar, tente numa janela anônima.</p></div></div>
  <script>
    // Se o sistema não iniciar em 10 s (Firebase bloqueado, sem internet, erro de configuração), mostra um aviso em vez da tela em branco
    window.addEventListener("error", (e) => { window.__erroVC = e.message; });
    setTimeout(() => { if (!window.__vcPronto) { document.getElementById("semConexao").classList.remove("hidden");
      if (window.__erroVC) document.getElementById("semConexaoMsg").textContent += " Detalhe: " + window.__erroVC; } }, 10000);
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
